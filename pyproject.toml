[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "csvhub-backend"
version = "0.3.10"
description = "Streaming CSV datasets, durable imports and indexed SQLite queries"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openpyxl>=3.1.5,<4", "xlrd>=2.0.2,<3", "defusedxml>=0.7.1,<1", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "xlwt==1.3.0"]

[tool.setuptools.packages.find]
include = ["csvhub*"]

[tool.setuptools.package-data]
csvhub = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.csv", "web/*.xls", "web/*.xlsx", "web/package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

